{{define "email-styles"}}
<style>
    /* Reset and base styles */
    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #333333;
        background-color: #f5f5f5;
    }

    /* Email wrapper */
    .email-wrapper {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
    }

    /* Header styles */
    .email-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        padding: 30px;
        text-align: center;
    }

    .email-header h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
    }

    .duck-emoji {
        font-size: 48px;
        margin-bottom: 10px;
    }

    /* Content styles */
    .email-content {
        padding: 30px;
    }

    h2 {
        color: #333333;
        font-size: 24px;
        margin-top: 0;
        margin-bottom: 20px;
    }

    h3 {
        color: #555555;
        font-size: 18px;
        margin-top: 25px;
        margin-bottom: 15px;
    }

    p {
        margin: 15px 0;
        color: #555555;
    }

    ul, ol {
        margin: 15px 0;
        padding-left: 30px;
        color: #555555;
    }

    li {
        margin: 8px 0;
    }

    /* Button styles */
    .btn {
        display: inline-block;
        padding: 12px 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 5px;
        font-weight: 600;
        margin: 10px 0;
    }

    .btn:hover {
        opacity: 0.9;
    }

    /* Alert styles */
    .alert {
        padding: 15px;
        border-radius: 5px;
        margin: 20px 0;
    }

    .alert-info {
        background-color: #e3f2fd;
        border-left: 4px solid #2196f3;
        color: #1565c0;
    }

    .alert-success {
        background-color: #e8f5e9;
        border-left: 4px solid #4caf50;
        color: #2e7d32;
    }

    .alert-warning {
        background-color: #fff3e0;
        border-left: 4px solid #ff9800;
        color: #e65100;
    }

    .alert-error {
        background-color: #ffebee;
        border-left: 4px solid #f44336;
        color: #c62828;
    }

    /* Duck card styles */
    .duck-card {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        border-radius: 10px;
        padding: 20px;
        margin: 20px 0;
    }

    .duck-card h3 {
        color: #333333;
        margin-top: 0;
        font-size: 22px;
    }

    .duck-details {
        width: 100%;
        margin: 15px 0;
    }

    .duck-details td {
        padding: 8px 10px;
        vertical-align: top;
    }

    .duck-details td:first-child {
        font-weight: 600;
        color: #666666;
        white-space: nowrap;
    }

    /* Footer styles */
    .email-footer {
        background-color: #f8f9fa;
        padding: 20px 30px;
        text-align: center;
        font-size: 14px;
        color: #888888;
        border-top: 1px solid #e9ecef;
    }

    .email-footer a {
        color: #667eea;
        text-decoration: none;
    }

    .email-footer a:hover {
        text-decoration: underline;
    }

    /* Section styles */
    .section {
        margin: 25px 0;
    }

    /* Responsive styles */
    @media only screen and (max-width: 600px) {
        .email-wrapper {
            width: 100% !important;
        }

        .email-content {
            padding: 20px !important;
        }

        h2 {
            font-size: 20px !important;
        }

        h3 {
            font-size: 16px !important;
        }
    }
</style>
{{end}}
